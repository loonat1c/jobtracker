<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1116;--s1:#171b22;--s2:#1f242d;--line:rgba(255,255,255,.1);--text:#ece8de;--mut:#8f9aa8;--acc:#e0b252;--ok:#4cc38a;--bad:#e5604f;--blue:#6aa7f0;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 Onest,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1{font:600 17px Unbounded,sans-serif;letter-spacing:-.02em}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
main{max-width:980px;margin:0 auto;padding:20px;display:grid;gap:20px}
input,textarea,select{width:100%;font:inherit;color:var(--text);background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:110px}
input,textarea,select{transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
button{font:600 14px Onest,sans-serif;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;background:var(--acc);color:#16120a}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.ghost:hover{border-color:var(--acc)}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
button{transition:transform .15s,background .2s,color .2s,border-color .2s}
button:hover:not(:disabled){transform:translateY(-1px)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.6;cursor:wait;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.box{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.box h2{font:600 15px Onest;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:160px}
details summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 14px;font-weight:500;background:transparent;color:var(--mut);border:1px solid var(--line)}
.chip.on{background:var(--acc);color:#16120a;border-color:var(--acc)}
.jobs{display:grid;gap:10px}
.job{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;background:var(--s1);border:1px solid var(--line);border-left:4px solid var(--c,var(--mut));border-radius:var(--r);cursor:pointer}
.job{transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .2s,background .2s}
.job:hover{border-color:var(--acc);border-left-color:var(--c,var(--mut));transform:translateY(-2px);background:color-mix(in srgb,var(--s1) 92%,var(--acc))}
.job.in{animation:jin .45s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0ms)}
@keyframes jin{from{opacity:0;transform:translateY(10px)}}
.job b{font-size:16px}.job .meta{color:var(--mut);font-size:13.5px}
.badge{align-self:start;font-size:12.5px;font-weight:600;padding:3px 12px;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.tags{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12.5px;padding:2px 10px;border-radius:8px;background:var(--s2);color:var(--mut)}
.empty{color:var(--mut);padding:8px 0}
.tabs{display:flex;gap:4px;padding:4px;background:var(--s1);border:1px solid var(--line);border-radius:999px}
.tab{background:transparent;color:var(--mut);padding:7px 16px;font-weight:500}
.tab.on{background:var(--acc);color:#16120a;font-weight:600}
.pane{display:grid;gap:20px}
.pane[hidden]{display:none}
#tab-jobs:not([hidden]),#tab-settings:not([hidden]){animation:pin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pin{from{opacity:0;transform:translateY(8px)}}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.due{color:var(--bad)!important;font-weight:600}
@media(max-width:560px){header{flex-wrap:wrap;gap:8px}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px;z-index:50;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.ov.show{opacity:1;visibility:visible;transition:opacity .25s}
.modal{width:100%;max-width:720px;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:12px}
.modal{transform:translateY(18px) scale(.98);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.ov.show .modal{transform:none}
.modal h2{font:600 19px Unbounded,sans-serif;letter-spacing:-.02em}
.modal ul{padding-left:18px;color:var(--text)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--s2);border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.2,.8,.2,1);z-index:100}
.toast.show{opacity:1;transform:translate(-50%,-8px)}
/* auth */
#auth{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:var(--bg)}
#auth.show{display:flex;animation:afade .4s}
#auth.leave{animation:aleave .45s forwards;pointer-events:none}
@keyframes afade{from{opacity:0}}
@keyframes aleave{to{opacity:0;transform:scale(1.04)}}
.acard{width:100%;max-width:320px;text-align:center;padding:24px}
.dots{display:flex;justify-content:center;gap:16px;margin:20px 0 8px}
.dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--mut)}
.dot{transition:background .2s,border-color .2s}
.dot.on{background:var(--acc);border-color:var(--acc);animation:dpop .3s}
@keyframes dpop{50%{transform:scale(1.5)}}
.dots.err{animation:sh .4s}.dots.err .dot{background:var(--bad);border-color:var(--bad)}
@keyframes sh{25%{transform:translateX(-9px)}50%{transform:translateX(9px)}75%{transform:translateX(-5px)}}
#amsg{min-height:20px;font-size:13px;color:var(--bad);margin-bottom:12px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:56px;border-radius:14px;background:var(--s2);color:var(--text);font:500 21px Unbounded,sans-serif;border:1px solid var(--line)}
.pad button:active{transform:scale(.94)}
.pad .x{visibility:hidden}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Job Tracker</h1>
  <nav class="tabs" id="tabs"><button class="tab on" data-t="jobs">Вакансии</button><button class="tab" data-t="settings">Настройки</button></nav>
  <button class="ghost" id="logout">Выйти</button>
</header>

<main>
  <section class="box pane" id="tab-settings" hidden>
    <h2>Настройки и профиль</h2>
    <label>Worker URL</label>
    <input id="wUrl" placeholder="https://sean.serjjoga.workers.dev/">
    <label>App token (хранится только в этом браузере)</label>
    <input id="wTok" type="password" autocomplete="off">
    <label>Мой профиль для писем: опыт, стек, достижения, чем горжусь (на английском)</label>
    <textarea id="profile" rows="8" placeholder="Mobile developer with N years of experience in…"></textarea>
    <div class="row" style="margin-top:12px"><button id="saveSet">Сохранить</button></div>
  </section>

  <div class="pane" id="tab-jobs">
  <section class="box">
    <h2>Новая вакансия</h2>
    <textarea id="jtext" placeholder="Вставь полный текст вакансии"></textarea>
    <div class="row" style="margin-top:10px">
      <input id="jurl" class="grow" placeholder="Ссылка на вакансию (необязательно)">
      <button id="parse">Разобрать и сохранить</button>
    </div>
  </section>

  <section>
    <div class="bar">
      <input id="q" class="grow" placeholder="Поиск: должность, компания, стек, заметка">
      <select id="sort" style="width:auto"><option value="new">Сначала новые</option><option value="old">Сначала старые</option><option value="follow">Ближайший follow-up</option><option value="title">По названию</option><option value="company">По компании</option></select>
    </div>
    <div class="chips" id="chips" style="margin-bottom:12px"></div>
    <div class="jobs" id="jobs"></div>
  </section>
  </div>
</main>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<div id="auth"><div class="acard">
  <h1>Job Tracker</h1>
  <div class="dots" id="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div id="amsg"></div>
  <div class="pad" id="pad"></div>
</div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getDatabase,ref,onValue,set,push,update,remove}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const cfg={apiKey:"AIzaSyBuEw_53-Oqg0IGBp4oc-rNTwNVXLiGW00",authDomain:"jobfindersean.firebaseapp.com",
  databaseURL:"https://jobfindersean-default-rtdb.europe-west1.firebasedatabase.app", // проверь в Realtime Database
  projectId:"jobfindersean",storageBucket:"jobfindersean.firebasestorage.app",messagingSenderId:"183526713019",appId:"1:183526713019:web:323eddddb7abcbbf0f2b9e"};
const app=initializeApp(cfg),db=getDatabase(app),auth=getAuth(app);

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=x=>Array.isArray(x)?x:[];
const ST={new:['Новая','var(--blue)'],applied:['Отправлено','var(--acc)'],interview:['Собеседование','var(--ok)'],offer:['Оффер','#b58cf0'],rejected:['Отказ','var(--bad)']};
let jobs={},filter='all',openId=null,started=false;const seen=new Set();

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3200);}

/* ── DeepSeek через Worker ── */
async function ai(messages,json){
  const url=localStorage.getItem('wUrl'),tok=localStorage.getItem('wTok');
  if(!url||!tok)throw new Error('Укажи Worker URL и токен в настройках');
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-App-Token':tok},body:JSON.stringify({messages,json})});
  const t=await r.text();
  if(!r.ok)throw new Error(r.status+': '+t.slice(0,160));
  return JSON.parse(t).choices[0].message.content;
}
const SYS_PARSE='Extract the job posting into json with keys: title, company, location, salary, employment_type, stack (array of technologies), requirements (array of short strings, max 8), summary (1-2 sentences in Russian). Use empty string or empty array if unknown. Return only json.';
const SYS_LETTER='You write concise, honest cover letters in English (150-220 words, 3 short paragraphs). Use only facts from the candidate profile, never invent experience. Match the candidate to the key requirements of the job. Friendly professional tone, no clichés, no placeholders except a greeting like "Dear Hiring Team,". Output only the letter text.';

/* ── настройки ── */
$('saveSet').onclick=async()=>{
  localStorage.setItem('wUrl',$('wUrl').value.trim());
  localStorage.setItem('wTok',$('wTok').value.trim());
  await set(ref(db,'profile'),{text:$('profile').value});
  toast('Сохранено');
};

/* ── добавить вакансию ── */
$('parse').onclick=async()=>{
  const text=$('jtext').value.trim();if(!text)return;
  const b=$('parse');b.disabled=true;b.textContent='Разбираю…';
  try{
    const j=JSON.parse(await ai([{role:'system',content:SYS_PARSE},{role:'user',content:text.slice(0,12000)}],true));
    await set(push(ref(db,'jobs')),{title:j.title||'Без названия',company:j.company||'',location:j.location||'',salary:j.salary||'',
      stack:arr(j.stack),req:arr(j.requirements),summary:j.summary||'',url:$('jurl').value.trim(),text,status:'new',letter:'',ts:Date.now()});
    $('jtext').value='';$('jurl').value='';toast('Вакансия сохранена');
  }catch(e){toast(e.message);}
  b.disabled=false;b.textContent='Разобрать и сохранить';
};

/* ── список ── */
function renderChips(){
  const n=s=>Object.values(jobs).filter(j=>s==='all'||j.status===s).length;
  $('chips').innerHTML=[['all','Все'],...Object.entries(ST).map(([k,v])=>[k,v[0]])]
    .map(([k,l])=>`<button class="chip${filter===k?' on':''}" data-f="${k}">${l} ${n(k)}</button>`).join('');
}
$('q').oninput=render;$('sort').onchange=render;
$('chips').onclick=e=>{const b=e.target.closest('[data-f]');if(b){filter=b.dataset.f;render();}};
function render(){
  renderChips();
  const q=$('q').value.trim().toLowerCase(),so=$('sort').value;
  const hay=j=>[j.title,j.company,j.location,j.note,...arr(j.stack)].join(' ').toLowerCase();
  const cmp={new:(a,b)=>b.ts-a.ts,old:(a,b)=>a.ts-b.ts,title:(a,b)=>(a.title||'').localeCompare(b.title||''),
    company:(a,b)=>(a.company||'').localeCompare(b.company||''),follow:(a,b)=>(a.follow||'9999').localeCompare(b.follow||'9999')}[so];
  const list=Object.entries(jobs).filter(([,j])=>(filter==='all'||j.status===filter)&&(!q||hay(j).includes(q))).sort((a,b)=>cmp(a[1],b[1]));
  const today=new Date().toLocaleDateString('sv');
  const fmt=d=>new Date(d+'T00:00').toLocaleDateString('ru',{day:'numeric',month:'short'});
  $('jobs').innerHTML=list.length?list.map(([k,j],i)=>{
    const [sl,sc]=ST[j.status]||ST.new;
    const meta=[j.company,j.location,j.salary].filter(Boolean).map(esc).join(' • ');
    const dt=[j.applied?'Отправлено '+fmt(j.applied):'',j.follow?'Follow-up '+fmt(j.follow):''].filter(Boolean).join(' • ');
    const over=j.follow&&j.follow<=today&&!['offer','rejected'].includes(j.status);
    return `<div class="job${seen.has(k)?'':' in'}" style="--c:${sc};--d:${Math.min(i,8)*40}ms" data-id="${k}"><b>${esc(j.title)}</b><span class="badge">${sl}</span>
      <span class="meta">${meta}</span><span class="meta${over?' due':''}">${dt}</span>
      ${arr(j.stack).length?`<div class="tags">${arr(j.stack).slice(0,8).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}</div>`;
  }).join(''):'<div class="empty">Пока пусто. Вставь текст вакансии выше.</div>';
  list.forEach(([k])=>seen.add(k));
  if(openId&&jobs[openId]&&$('ov').classList.contains('show')===false)openId=null;
}
$('jobs').onclick=e=>{const c=e.target.closest('[data-id]');if(c)openJob(c.dataset.id);};

/* ── карточка вакансии ── */
function openJob(id){
  const j=jobs[id];if(!j)return;openId=id;
  $('modal').innerHTML=`
    <h2>${esc(j.title)}</h2>
    <div class="meta" style="color:var(--mut)">${[j.company,j.location,j.salary].filter(Boolean).map(esc).join(' • ')}</div>
    ${j.summary?`<p>${esc(j.summary)}</p>`:''}
    ${arr(j.req).length?`<ul>${arr(j.req).map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:''}
    <div class="row">
      <select id="mst" style="width:auto">${Object.entries(ST).map(([k,v])=>`<option value="${k}"${j.status===k?' selected':''}>${v[0]}</option>`).join('')}</select>
      ${j.url?`<a href="${esc(j.url)}" target="_blank" rel="noopener" style="color:var(--acc)">Открыть вакансию</a>`:''}
    </div>
    <div class="row">
      <div class="grow"><label>Дата отправки</label><input type="date" id="mapp" value="${esc(j.applied||'')}"></div>
      <div class="grow"><label>Follow-up</label><input type="date" id="mfol" value="${esc(j.follow||'')}"></div>
    </div>
    <label>Заметки</label>
    <textarea id="mnote" rows="4" placeholder="Контакты рекрутера, вопросы, детали собеседования…">${esc(j.note)}</textarea>
    <label>Cover letter</label>
    <textarea id="mlet" rows="12" placeholder="Нажми «Написать письмо»">${esc(j.letter)}</textarea>
    <div class="row">
      <button id="mgen">Написать письмо</button>
      <button class="ghost" id="msave">Сохранить текст</button>
      <button class="ghost" id="mcopy">Копировать</button>
      <span class="grow"></span>
      <button class="danger" id="mdel">Удалить</button>
      <button class="ghost" id="mclose">Закрыть</button>
    </div>
    <details><summary style="font-weight:500;color:var(--mut)">Исходный текст</summary><p style="white-space:pre-wrap;color:var(--mut);font-size:13.5px">${esc(j.text)}</p></details>`;
  $('ov').classList.add('show');
  $('mst').onchange=()=>{
    const u={status:$('mst').value};
    if(u.status==='applied'&&!jobs[id].applied){u.applied=new Date().toLocaleDateString('sv');$('mapp').value=u.applied;}
    update(ref(db,'jobs/'+id),u);
  };
  $('mapp').onchange=()=>update(ref(db,'jobs/'+id),{applied:$('mapp').value});
  $('mfol').onchange=()=>update(ref(db,'jobs/'+id),{follow:$('mfol').value});
  $('mnote').onchange=()=>update(ref(db,'jobs/'+id),{note:$('mnote').value});
  $('msave').onclick=()=>update(ref(db,'jobs/'+id),{letter:$('mlet').value}).then(()=>toast('Сохранено'));
  $('mcopy').onclick=()=>navigator.clipboard.writeText($('mlet').value).then(()=>toast('Скопировано'));
  $('mclose').onclick=closeJob;
  $('mdel').onclick=()=>{if(confirm('Удалить вакансию?')){remove(ref(db,'jobs/'+id));openId=null;closeJob();}};
  $('mgen').onclick=async()=>{
    const prof=$('profile').value.trim();
    if(!prof){toast('Сначала заполни профиль в настройках');return;}
    const b=$('mgen');b.disabled=true;b.textContent='Пишу…';
    try{
      const out=await ai([{role:'system',content:SYS_LETTER},{role:'user',content:
        `CANDIDATE PROFILE:\n${prof}\n\nJOB: ${j.title} at ${j.company}\n${j.summary}\nRequirements: ${arr(j.req).join('; ')}\n\nFULL POSTING:\n${(j.text||'').slice(0,6000)}`}],false);
      $('mlet').value=out.trim();
      await update(ref(db,'jobs/'+id),{letter:out.trim()});
    }catch(e){toast(e.message);}
    b.disabled=false;b.textContent='Написать письмо';
  };
}
function closeJob(){
  if(openId&&jobs[openId]&&$('mnote')&&$('mnote').value!==(jobs[openId].note||''))update(ref(db,'jobs/'+openId),{note:$('mnote').value});
  $('ov').classList.remove('show');openId=null;
}
$('ov').onclick=e=>{if(e.target===$('ov'))closeJob();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('ov').classList.contains('show'))closeJob();});

/* ── данные ── */
function start(){
  $('wUrl').value=localStorage.getItem('wUrl')||'';
  $('wTok').value=localStorage.getItem('wTok')||'';
  onValue(ref(db,'jobs'),s=>{jobs=s.val()||{};render();});
  onValue(ref(db,'profile'),s=>{const p=s.val();if(p&&document.activeElement!==$('profile'))$('profile').value=p.text||'';});
}
$('tabs').onclick=e=>{
  const b=e.target.closest('[data-t]');if(!b)return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));
  $('tab-jobs').hidden=b.dataset.t!=='jobs';
  $('tab-settings').hidden=b.dataset.t!=='settings';
};
$('logout').onclick=()=>signOut(auth);

/* ── вход по коду (как в bfnames) ── */
const AUTH_EMAIL='jobs@jobtracker.app',PREFIX='jt38362',PIN_LEN=4;
let pin='',busy=false;
const dots=$('dots'),amsg=$('amsg'),authEl=$('auth');
$('pad').innerHTML=['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k===''?'<button class="x" tabindex="-1"></button>':`<button data-k="${k}">${k}</button>`).join('');
$('pad').onclick=e=>{const b=e.target.closest('[data-k]');if(b)key(b.dataset.k);};
document.addEventListener('keydown',e=>{
  if(!authEl.classList.contains('show')||e.ctrlKey||e.metaKey)return;
  if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('⌫');
});
function paint(){[...dots.children].forEach((d,i)=>d.classList.toggle('on',i<pin.length));}
function key(k){
  if(busy)return;
  if(k==='⌫')pin=pin.slice(0,-1);else if(pin.length<PIN_LEN)pin+=k;
  amsg.textContent='';dots.className='dots';paint();
  if(pin.length===PIN_LEN)submit();
}
async function submit(){
  busy=true;
  try{await signInWithEmailAndPassword(auth,AUTH_EMAIL,PREFIX+pin);}
  catch(e){
    dots.classList.add('err');
    amsg.textContent=e.code==='auth/too-many-requests'?'Слишком много попыток, подожди пару минут':e.code==='auth/network-request-failed'?'Нет связи с сервером':e.code==='auth/operation-not-allowed'?'В Firebase не включён вход по паролю':'Неверный код';
    setTimeout(()=>{pin='';paint();dots.classList.remove('err');busy=false;},700);
    return;
  }
  busy=false;
}
onAuthStateChanged(auth,u=>{
  if(u){if(authEl.classList.contains('show')){authEl.classList.add('leave');setTimeout(()=>authEl.classList.remove('show','leave'),450);}pin='';paint();if(!started){started=true;start();}}
  else{started=false;authEl.classList.remove('leave');authEl.classList.add('show');}
});
</script>
</body>
